# Builds AlloyCore on every pull request: compile, unit tests, then walkcheck (traps, lava, impossible jumps).
# Build + tests match what tools/automerge.py runs before it merges, so a red X there means automerge refuses the PR
# too, but here the error shows on the PR. Walkcheck runs with --strict here, so a walkcheck problem also fails the
# check (automerge only prints walkcheck results).
name: AlloyCore build

on:
  pull_request:
    paths: ["plugins-src/**", ".github/workflows/alloycore-build.yml"]
  push:
    branches: [main]
    paths: ["plugins-src/**", ".github/workflows/alloycore-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alloycore-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test + walkcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins-src/AlloyCore
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 9.1 (first release that runs on Java 25)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      # gradle.properties points the toolchain at the server PC's JDK (a Windows path); point it at this one instead.
      - name: Build and test
        run: gradle build --no-daemon --stacktrace "-Porg.gradle.java.installations.paths=$JAVA_HOME"

      # Plain `gradle walkcheck` only prints problems; --strict makes it fail the check (exit 1) when it finds any.
      - name: Walkcheck (strict)
        run: gradle walkcheck --no-daemon "--args=--strict" "-Porg.gradle.java.installations.paths=$JAVA_HOME"

      - name: Test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: plugins-src/AlloyCore/build/reports/tests/
          if-no-files-found: ignore
