# Builds AlloyCore on every pull request: compile, unit tests, then walkcheck (traps, lava, impossible jumps).
# Same checks tools/automerge.py runs on the server PC before it merges, so a red X here means automerge will
# refuse the PR too - but here the error is visible on the PR instead of only in tools/autoupdate.log.
name: AlloyCore build

on:
  pull_request:
    paths: ["plugins-src/**", ".github/workflows/alloycore-build.yml"]
  push:
    branches: [main]
    paths: ["plugins-src/**", ".github/workflows/alloycore-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alloycore-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test + walkcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins-src/AlloyCore
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 9.1 (first release that runs on Java 25)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      # gradle.properties points the toolchain at the server PC's JDK (a Windows path); point it at this one instead.
      - name: Build, test, walkcheck
        run: gradle build walkcheck --no-daemon --stacktrace "-Porg.gradle.java.installations.paths=$JAVA_HOME"

      - name: Test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: plugins-src/AlloyCore/build/reports/tests/
          if-no-files-found: ignore
