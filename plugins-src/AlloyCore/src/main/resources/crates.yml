# BlackForgeMC crates (ids stay iron/gold/netherite/koth/vote; players see Cinder/Molten/Forgeheart/Conqueror/Spark). Edit and restart the survival server to apply.
# Reward fields: name (shown), item, amount, weight (higher = more common), enchants {id: level},
#   custom-name, commands (run by console, {player} = winner), give-item (false for command-only), announce (broadcast win)

