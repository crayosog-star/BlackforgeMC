# hub | arcade | backend
mode: backend

# true once the BlackForgeMC resource pack is served on this server: custom items then use their textures by default
# (an item's own custom-model setting still wins). False = items show as their vanilla base item.
resource-pack-live: false

# Gale Bellows PvP item (survival only). Every player gets one on first join; /jbello gives another if they
# don't carry one. Set false to stop it firing. Its custom texture needs the resource pack: leave custom-model
# false until the pack is live (otherwise it shows as the purple/black missing model); until then it is a
# glinting breeze rod with its name.
gale-bellows:
  enabled: true
  custom-model: false
  cooldown-seconds: 7   # seconds between blasts (and Gale jumps), Arena included; 0 = no cooldown

# Potion of Gaia (survival only): a pink splash potion that grows a mist, blooms, and rises as an 8-block
# platform. Works without the resource pack; with it (resource-pack-live) it gets its own texture. Staff: /gaia. Crates: blackforge gaia give {player}. Set false to stop it.
gaia-potion:
  enabled: true

# Potion of Darkness (survival + hub Arena): splash potion; 5.5 s of total darkness for players where PvP is on, confuses
# mobs anywhere. Staff: /darkness. Crates: blackforge darkness give {player}. Set false to stop it.
darkness-potion:
  enabled: true

# Surge (survival + hub Arena): one-use ability item. 6 s of speed/jump/step-up with a health drain that never goes
# below half health. Staff: /surge. Crates: blackforge surge give {player}. custom-model: true only once the resource pack
# with the Surge textures is live. Set enabled false to stop it.
# screen-darkness: once the black Darkness starts it stays on (pulsing) for the rest of the surge; false = a short pulse only.
# darkness-start-distance: the Darkness only starts once the surger is this many blocks from where the surge began
# (any direction, flat distance). 0 = from the start. The red screen edges, night sky and rain are not affected.
surge:
  enabled: true
  custom-model: false
  screen-darkness: true
  darkness-start-distance: 20

# EMP (hub Arena only for now): right-click to launch up; at the top a wave rolls out `radius` blocks (10 = a
# 20-block-wide circle) and shuts down every other player's ability inside it (cages fall, surges end, chains snap...),
# strips everyone else's potion effects and cleanses the caster's debuffs. One use. Staff: /emp. Set enabled false to stop it.
emp:
  enabled: true
  radius: 10
  cooldown-seconds: 45

# Nightrend (hub Arena only for now): dual-wielded daggers, left-click melee only, no sweep. One in your main hand hits
# for `damage` at `attack-speed` a second, with `reach-change` blocks of reach (normal reach is 3). A Nightrend in each
# hand raises that to `pair-attack-speed`; swings alternate arms, with a `repeat-side-chance` of the same arm twice,
# when that blade's glow swells for a second (cosmetic). A different sword in the off hand gives `mixed-attack-speed`
# instead (speed only). Hits from the `behind-arc-degrees` arc behind the target (centred on its back) do
# `behind-damage` of normal damage (0.6 = 60%). An EMP turns both speed bonuses off for `emp-seconds`. Equipping the pair flips both blades up into your hands, at most
# once per `flip-cooldown-seconds`. Staff: /nightrend (/daggers). Set enabled false to stop it.
nightrend:
  enabled: true
  damage: 5
  attack-speed: 2.0
  pair-attack-speed: 2.6
  reach-change: -0.5
  behind-arc-degrees: 120
  behind-damage: 0.6
  emp-seconds: 4
  flip-cooldown-seconds: 3
  mixed-attack-speed: 2.3
  repeat-side-chance: 0.03
  left-swing-delay-ticks: 3   # the left swing waits this long, or your own game ignores it mid right-swing

# Rimelock (hub Arena only for now): leap, slam, and a 16-block-tall, 6-block-radius cage holds for 10 s. Nobody
# inside can leave, mobs included, except the caster (and their team, once teams exist); anyone can walk in; no hits
# cross the wall either way. The caster's side sees it blue, everyone else red. Staff: /rimelock (/cage).
# The way out: a player the cage holds can right-click an Ashen Chain at one of the 8 crystals over the rim posts to be
# reeled up and over the wall (crystal-escape). Only where both items are wired together (the hub Arena for now).
rimelock:
  enabled: true
  crystal-escape:
    enabled: true
    single-use: true           # a hooked crystal shatters and stays gone for the rest of that cage
    aim-radius: 1.5            # blocks: the hit sphere round each crystal (how forgiving the aim is)
    vault-seconds: 0.3         # the outward carry over the rim once the reel arrives
    vault-speed: 0.4           # blocks a tick at the start of the carry, easing down
    pass-grace-seconds: 1.0    # the wall keeps letting them through this long after they arrive
    no-fall-max-seconds: 4     # no fall damage until they land, up to this long

# Gods-eye (hub Arena only for now): marks the closest player for 10 s - halo, beam into the sky, banner with their
# face and name; the caster gets distance + direction. Staff: /godseye (/eye). Set false to stop it.
gods-eye:
  enabled: true

# Ashen Chain (hub Arena only for now): right-click to grapple - drag yourself to the block you aim at (24 away).
# Left-click to strike - a skillshot (12 away, or point-blank). A hit sets a player on fire for burn-seconds (real
# fire, no other damage), then after pull-delay-seconds yanks them 1 block closer - unless they break free first with
# Surge, their own chain, water, cover, or by getting 16 away. Hostile mobs are still hooked for 1 heart and dragged
# to you. Sneak to let go of a grapple. Staff: /ashenchain (/chain, /tether).
ashen-chain:
  enabled: true
  cooldown-seconds: 3              # 0 = no cooldown
  player-hit-cooldown-seconds: 5   # cooldown after chaining a player
  burn-seconds: 3                  # how long they're on fire (vanilla fire: about half a heart a second)
  pull-delay-seconds: 0.5          # the break-free window between the hit and the yank
  throw-speed: 30                  # how fast the hook flies, blocks a second (was 80): 12 blocks in 0.4 s

# Ashen Bonfire (hub Arena only for now): right-click the ground to kindle a bonfire that heals EVERYONE in its ring
# (enemies too) for a while. Anyone can snuff it out with a few hits. Staff: /bonfire (/totem).
ashen-bonfire:
  enabled: true
  cooldown-seconds: 20
  duration-seconds: 10
  radius: 4
  heal-hearts-per-second: 1
  hits: 5

# Last Rite (Survival, Factions, hub Arena): a wave pulls the first enemy it touches into a 1v1 chamber.
# timeout: both-die | both-weakened (leave empty for the server's default: Survival weakened, Factions/Arena die)
last-rite:
  enabled: true
  charges-needed: 3        # player kills to charge a scroll
  cooldown-seconds: 300    # after a rite (a miss: 30 s)
  duel-seconds: 40
  timeout: ''
  allow-totems: true
  chamber-slots: 8         # rites at once per server

# Base Station (Survival + Skyblock): one per claim or island. Sells Hopper Upgrades, upgrades Agents, collects their output.
base-station:
  enabled: true
  price: 25000
  essence: 128
  agent-radius: 16
  custom-ui: true          # false = plain menus

# Hopper tiers I, II, III. delays = ticks between moves (vanilla is 8). upgrades-needed = I to II, then II to III.
hopper-upgrades:
  enabled: true            # false = hoppers run at vanilla speed; tiers are kept
  delays: [8, 4, 1]
  upgrades-needed: [1, 10]
  price: 20000             # per Hopper Upgrade
  essence: 128             # per Hopper Upgrade
  max-per-chunk: 16

# Forge Allays: a base upgrade that stays at the Base Station and moves items (plan: docs/plans/forge-allays.md).
# Survival and the Foundry only. Lists are per tier I, II, III. With enabled and preview-staff both false, no allays fly and tiers are kept.
allays:
  enabled: true
  preview-staff: true             # staff get the Forge's allay menu on Survival with real money, before enabled is on
  flock: [1, 2, 3]                # allays per base
  leash: [12, 20, 28]             # blocks from the Station, and never outside the claim
  price: [75000, 250000, 750000]  # to reach each tier
  essence: [256, 1024, 4096]      # to reach each tier
  carry: 16                       # items per trip
  speed: 6.0                      # blocks a second
  pause-seconds: 1.0              # pause after each trip
  min-drop-age-ticks: 60          # leaves newer drops alone, so players can pick up their own
  scan-seconds: 5                 # how often a base looks for work
  link-scan-seconds: 30           # how often a base looks for framed chests
  max-scans-per-tick: 4           # bases scanned per tick across the server
  sell-fee: 0.10                  # Steward's cut of a sale
  sausage-flip: true              # an allay named Smoked Sausage flies upside down

# Agents, called robots in the code and saves (Survival + Skyblock copper golems). NOT read by the plugin yet - a later task wires these up.
# fish-seconds (per robot tier I..V) and fisher-burn match the built-in values in RobotRules; the rest are for the
# upcoming chest trips (radius in blocks, store when any item reaches store-threshold, fetch fuel at 2 minutes left).
robots:
  chest-radius: 10
  clock-seconds: 60
  store-threshold: 20
  fuel-fetch-minutes: 2
  walk-speed: 4.0
  fish-seconds: [180, 150, 120, 90, 60]
  fisher-burn: 0.25
  # Logs each Grinder's result when it changes (fuel, mobs found, skipped and why, hits, kills).
  # If this key is missing, it's on for the Arena's Foundry and off everywhere else.
  # grinder-debug-log: true

# The Academy: Agents earn Mastery by working (Survival, once live). live-modes lists the server modes it's on for; the
# Arena's Foundry always has it, for testing. Nothing reads these yet except the startup log line for live-modes.
# level-base and level-exponent: total points for a level = base x level^exponent. Per job, per UTC day: full points up
# to daily-soft-cap, then over-cap-rate of them. coach-mult applies while the owner is within coach-radius blocks.
academy:
  live-modes: []
  points-per-work:
    miner: 1
    farmer: 1
    grinder: 2
    fisherman: 12
  level-base: 20
  level-exponent: 2.0
  max-level: 30
  daily-soft-cap: 1500
  over-cap-rate: 0.25
  coach-radius: 16
  coach-mult: 1.25
  perks: {}
  specs: {}
  traits: {}

# The Trader in the Gilded Grove (Survival): sells raw farmed goods for the player's balance.
# Per player, per item, per UTC day: full price up to daily-soft-cap, then over-cap-rate of the price.
# Override any default price under prices, for example:  wheat: 1.5
grove-shop:
  enabled: true
  daily-soft-cap: 1728
  over-cap-rate: 0.25
  prices: {}

# The Sundering (Survival): five bosses chained in their own arena (/warp sundering). Every Saturday at 1pm Central one breaks free.
# The day and time are in Events.WEEKLY. The damage split decides the loot; anyone under min-share gets nothing.
boss:
  size: 2.0                # how much bigger than the old world bosses
  fight-seconds: 600       # the fight length to aim for, whatever the crowd size
  player-dps: 12           # the damage per second one player is assumed to deal, used with fight-seconds
  time-limit-seconds: 1200 # after this it retreats to its pit
  money-pool: 25000
  scrap-pool: 1500
  min-share: 0.01
  retreat-share: 0.25      # if it retreats, this much of the money and Scrap is still paid (no keys)
  key-rolls: [netherite, gold, gold, iron, iron, iron]   # each key goes to one player; your damage share is your chance

# The Foundry: the Arena's build-and-test island (hub server). Agents, hopper tiers and the Forge are free there, and
# everything a player places goes when they leave. These limits only apply inside it.
foundry:
  max-agents-per-player: 20
  max-agents-total: 60
  max-upgraded-hoppers-per-chunk: 64
  max-allays-total: 12

# Black Forge hub (hub server only). Commands: /blackforge setspawn | reload | dragons | effects | portals | info
hub:
  # portal -> proxy server name (change if a backend is registered under another name in the proxy)
  portals:
    survival: survival
    arcade: arcade
    factions: factions
    skyblock: skyblock
  # spawn: set in-game with /blackforge setspawn (until set, the built-in spawn is used)
  join:
    enabled: true                     # false = no arrival effects at all
    full-show-cooldown-minutes: 360   # a returning player sees the full "Forge Awakens" show only after this long away (first join always does)
    short-effects: true               # the quick ring of fire + embers for everyone else
    roar-chance: 0.2                  # chance of a soft dragon roar on the short arrival
  dragons:
    enabled: true                     # takes effect on hub restart
    fire-interval-scale: 1.0          # 2 = dragons breathe fire half as often, 0.5 = twice as often
