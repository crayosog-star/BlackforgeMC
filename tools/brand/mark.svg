<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".5" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#ff4d00"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22222b"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8a98"/>
      <stop offset=".35" stop-color="#4a4a56"/>
      <stop offset="1" stop-color="#1e1e26"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6b78"/>
      <stop offset="1" stop-color="#26262e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1c2" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffb347" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- forged hexagon badge -->
  <path d="M64 5 L116 34.5 V93.5 L64 123 L12 93.5 V34.5 Z" fill="url(#badge)" stroke="url(#ember)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M64 15 L107 39.5 V88.5 L64 113 L21 88.5 V39.5 Z" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- strike glow -->
  <circle cx="84" cy="58" r="24" fill="url(#glow)"/>

  <!-- anvil -->
  <path d="M24 63 Q32 58.5 44 58.5 H95 L97.5 66.5 L87 70.5 Q77 72.5 75 77 V82.5 L83 86 L85 95 H43 L45 86 L53 82.5 V77 Q51 72.5 43 70.5 Q31 69 24 63 Z" fill="url(#steel)"/>
  <path d="M30 61.5 Q36 59 44 58.5 H95" fill="none" stroke="url(#ember)" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="40" y="95" width="48" height="5" rx="2" fill="#2a2a33"/>

  <!-- hammer, mid-strike -->
  <g transform="rotate(32 72 47)">
    <rect x="69.5" y="9" width="5.5" height="35" rx="2.75" fill="#2c2c35" stroke="#0b0b0f" stroke-width="1"/>
    <rect x="70.6" y="11" width="1.6" height="30" rx=".8" fill="#ffffff" opacity=".12"/>
    <rect x="55" y="39" width="35" height="15" rx="3" fill="url(#head)" stroke="#0b0b0f" stroke-width="1"/>
    <rect x="85" y="39" width="5" height="15" rx="2" fill="url(#ember)"/>
  </g>

  <!-- sparks fly off the strike -->
  <g fill="#ffd27a">
    <path d="M102 38 l1.8 3.8 3.8 1.8 -3.8 1.8 -1.8 3.8 -1.8 -3.8 -3.8 -1.8 3.8 -1.8 z"/>
    <path d="M92 28 l1.1 2.3 2.3 1.1 -2.3 1.1 -1.1 2.3 -1.1 -2.3 -2.3 -1.1 2.3 -1.1 z"/>
    <path d="M104 22 l1.2 2.5 2.5 1.2 -2.5 1.2 -1.2 2.5 -1.2 -2.5 -2.5 -1.2 2.5 -1.2 z"/>
  </g>
  <circle cx="106" cy="52" r="1.5" fill="#ff8a2a"/>
  <circle cx="98" cy="47" r="1.2" fill="#ffd27a"/>
  <circle cx="110" cy="40" r="1.2" fill="#ff8a2a"/>
</svg>
